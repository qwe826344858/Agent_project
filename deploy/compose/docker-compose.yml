services:
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: ../../deploy/docker/frontend/Dockerfile
      args:
        API_UPSTREAM: ${API_UPSTREAM:-http://172.17.0.1:34567}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:34567}
        NEXT_PUBLIC_LEGACY_CHAT_URL: ${NEXT_PUBLIC_LEGACY_CHAT_URL:-/api/chat}
        NEXT_PUBLIC_AGENT_CHAT_URL: ${NEXT_PUBLIC_AGENT_CHAT_URL:-/api/agent/chat}
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:34567}
      - NEXT_PUBLIC_LEGACY_CHAT_URL=${NEXT_PUBLIC_LEGACY_CHAT_URL:-/api/chat}
      - NEXT_PUBLIC_AGENT_CHAT_URL=${NEXT_PUBLIC_AGENT_CHAT_URL:-/api/agent/chat}
      - API_UPSTREAM=${API_UPSTREAM:-http://172.17.0.1:34567}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  backend:
    build:
      context: ../../apps/backend
      dockerfile: ../../deploy/docker/backend/Dockerfile
    environment:
      - APP_ENV=${APP_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      # LLM 通用
      - LLM_PROVIDER=${LLM_PROVIDER:-minimax}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-}
      # Provider 专属 Key（按需注入）
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_API_BASE=${MINIMAX_API_BASE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_API_BASE=${QWEN_API_BASE:-}
      # 搜索 & 存储
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-}
      - EMBEDDING_TIMEOUT=${EMBEDDING_TIMEOUT:-30}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
      - INGEST_NAMESPACE=${INGEST_NAMESPACE:-default}
      - INGEST_CHUNK_SIZE=${INGEST_CHUNK_SIZE:-1200}
      - INGEST_CHUNK_OVERLAP=${INGEST_CHUNK_OVERLAP:-200}
      - INGEST_MIN_CN_CHARS=${INGEST_MIN_CN_CHARS:-50}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
